# Security headers for xs.massagehomeriyadh.com (placed inside the server block).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
# Report-Only: never enforce until violations are reviewed.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' wss://xs.massagehomeriyadh.com https://cdn.jsdelivr.net blob: data:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
